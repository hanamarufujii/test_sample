<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --tile: #141414;
    --tile-hover: #1d1d1d;
    --fg: #f2f2f2;
    --dim: #6b6b6b;
    --line: #262626;
    --accent: #ff3b1f;
    --font: "Futura", "Futura PT", "Jost", "Century Gothic", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  button {
    font: inherit; letter-spacing: inherit; text-transform: inherit;
    color: var(--fg); background: none; border: 1px solid var(--line);
    padding: 10px 18px; cursor: pointer; transition: border-color .2s, opacity .2s;
  }
  button:hover { border-color: var(--fg); }
  button.primary { border-color: var(--fg); }
  button:disabled { opacity: .3; cursor: default; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 40px; min-height: 100%; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  header .logo { font-weight: 500; cursor: pointer; }
  header .logo span { color: var(--accent); }
  .meta { color: var(--dim); display: flex; gap: 18px; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px 0; }
  footer { color: var(--dim); font-size: 9px; border-top: 1px solid var(--line); padding-top: 14px; display: flex; justify-content: space-between; }
  .jp { text-transform: none; letter-spacing: 0.06em; color: var(--dim); font-size: 10px; }

  /* ---------- menu ---------- */
  .hero {
    position: relative; border-radius: 18px; overflow: hidden; background: #e4e4e2; color: #111;
    aspect-ratio: 16 / 10; display: flex; flex-direction: column; justify-content: flex-end; padding: 22px;
  }
  .hero svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero .copy { position: relative; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .hero h1 { font-weight: 500; font-size: 13px; letter-spacing: .2em; }
  .hero .copy .jp { color: #555; margin-top: 4px; }
  .hero button { border: 0; background: #111; color: #f2f2f2; border-radius: 999px; padding: 10px 20px; white-space: nowrap; }
  .hero button:hover { background: var(--accent); }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
  .tile {
    background: var(--tile); border-radius: 14px; aspect-ratio: 1; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    position: relative; transition: background .2s; padding: 8px; text-align: center;
  }
  .tile:hover { background: var(--tile-hover); }
  .tile svg { width: 34px; height: 34px; overflow: visible; }
  .tile .lbl { font-size: 10px; font-weight: 500; }
  .tile .jp { font-size: 9px; }
  .tile .best { position: absolute; top: 9px; right: 11px; font-size: 8px; color: var(--dim); letter-spacing: .08em; }

  /* ---------- play ---------- */
  .bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  .bar .task { display: flex; flex-direction: column; gap: 6px; }
  .dots { display: flex; gap: 6px; padding-top: 3px; }
  .dots i { width: 6px; height: 6px; border: 1px solid var(--dim); border-radius: 50%; display: block; }
  .dots i.on { background: var(--fg); border-color: var(--fg); }
  .stage { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 14px; background: #050505; touch-action: none; }
  .stage text { text-transform: none; letter-spacing: 0; font-family: var(--font); }
  .stage .drag { cursor: grab; }
  .stage .drag:active { cursor: grabbing; }
  .stage .click { cursor: pointer; }
  .extra:empty { display: none; }
  .extra { margin-top: 16px; }
  .controls { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .result { color: var(--dim); line-height: 1.7; }
  .result b { color: var(--fg); font-weight: 500; }
  .slider { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; color: var(--dim); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: #3a3a3a; }
  input[type=range]::-moz-range-track { height: 1px; background: #3a3a3a; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--fg); margin-top: -6px; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--fg); border: 0; }

  /* ---------- result ---------- */
  .final { display: flex; flex-direction: column; gap: 20px; }
  .final .score { font-size: 96px; font-weight: 300; letter-spacing: 0; line-height: 1; }
  .final .rows { border-top: 1px solid var(--line); }
  .final .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--dim); }
  .final .row b { color: var(--fg); font-weight: 400; }

  @media (max-width: 560px) {
    .tiles { gap: 8px; }
    .tile { border-radius: 12px; gap: 6px; }
    .tile svg { width: 26px; height: 26px; }
    .tile .lbl { font-size: 8px; letter-spacing: .1em; }
    .tile .jp { font-size: 8px; }
    .tile .best { display: none; }
    .hero { aspect-ratio: 4 / 3; padding: 16px; }
    .final .score { font-size: 64px; }
    .meta .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="home">Design Puzzle<span>.</span></div>
    <div class="meta"><span class="hide-sm" id="modeLabel"></span><span id="roundLabel"></span></div>
  </header>
  <main id="main"></main>
  <footer><span>A puzzle for graphic designers</span><span>Enter = OK &nbsp; Esc = Menu</span></footer>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const W = 600, H = 400;
  const ROUNDS = 3;
  const ACCENT = '#ff3b1f', FG = '#f2f2f2', DIM = '#6b6b6b';
  const PHI = (1 + Math.sqrt(5)) / 2, SILVER = Math.SQRT2;

  const $main = document.getElementById('main');
  const $mode = document.getElementById('modeLabel');
  const $round = document.getElementById('roundLabel');

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const S = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const label = (parent, x, y, text, fill = DIM, size = 10, anchor = 'start') => { const t = S('text', { x, y, fill, 'font-size': size, 'text-anchor': anchor }, parent); t.textContent = text; return t; };

  const store = {
    get(k) { try { return Number(localStorage.getItem('dp_' + k)) || 0; } catch { return 0; } },
    set(k, v) { try { localStorage.setItem('dp_' + k, String(v)); } catch {} }
  };

  function svgPoint(svg, e) {
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    return p.matrixTransform(svg.getScreenCTM().inverse());
  }
  // Drag helper: move(dx, dy, point) is called in SVG units
  function draggable(node, svg, ctx, { start, move, end }) {
    node.addEventListener('pointerdown', e => {
      if (ctx.locked) return;
      e.preventDefault();
      const p0 = svgPoint(svg, e);
      start && start(p0);
      const mv = ev => { const p = svgPoint(svg, ev); move(p.x - p0.x, p.y - p0.y, p); };
      const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); end && end(); };
      window.addEventListener('pointermove', mv);
      window.addEventListener('pointerup', up);
    });
  }

  // ---------- simple shapes ----------
  function shapeAttrs(s) {
    const { type, size: a, x, y } = s;
    if (type === 'circle') return ['circle', { cx: x, cy: y, r: a / 2 }];
    if (type === 'square') return ['rect', { x: x - a / 2, y: y - a / 2, width: a, height: a }];
    const h = a * Math.sqrt(3) / 2;
    return ['polygon', { points: `${x},${y - h / 2} ${x + a / 2},${y + h / 2} ${x - a / 2},${y + h / 2}` }];
  }
  function drawShape(parent, s, style) { const [tag, at] = shapeAttrs(s); return S(tag, { ...at, ...style }, parent); }
  function pathOnCanvas(c, s, k) {
    const { type, size: a } = s, x = s.x * k, y = s.y * k, A = a * k;
    c.beginPath();
    if (type === 'circle') c.arc(x, y, A / 2, 0, Math.PI * 2);
    else if (type === 'square') c.rect(x - A / 2, y - A / 2, A, A);
    else { const h = A * Math.sqrt(3) / 2; c.moveTo(x, y - h / 2); c.lineTo(x + A / 2, y + h / 2); c.lineTo(x - A / 2, y + h / 2); c.closePath(); }
    c.fill();
  }
  function iou(shapesA, shapesB) {
    const k = 0.5, w = W * k, h = H * k;
    const mask = list => {
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const c = cv.getContext('2d'); c.fillStyle = '#000';
      list.forEach(s => pathOnCanvas(c, s, k));
      return c.getImageData(0, 0, w, h).data;
    };
    const a = mask(shapesA), b = mask(shapesB);
    let inter = 0, uni = 0;
    for (let i = 3; i < a.length; i += 4) { const A = a[i] > 127, B = b[i] > 127; if (A && B) inter++; if (A || B) uni++; }
    return uni ? inter / uni : 0;
  }

  // ---------- color ----------
  const tint = (rgb, t) => rgb.map(v => Math.round(255 - (255 - v) * t));
  const rgbStr = c => `rgb(${c.map(Math.round).join(',')})`;
  function rgbToLab(rgb) {
    let [r, g, b] = rgb.map(v => { v /= 255; return v > 0.04045 ? ((v + 0.055) / 1.055) ** 2.4 : v / 12.92; });
    let x = (r * 0.4124 + g * 0.3576 + b * 0.1805) / 0.95047, y = r * 0.2126 + g * 0.7152 + b * 0.0722, z = (r * 0.0193 + g * 0.1192 + b * 0.9505) / 1.08883;
    const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
    x = f(x); y = f(y); z = f(z);
    return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
  }
  const deltaE = (a, b) => { const A = rgbToLab(a), B = rgbToLab(b); return Math.hypot(A[0] - B[0], A[1] - B[1], A[2] - B[2]); };
  const multiply = films => films.reduce((c, f) => c.map((v, i) => v * f.rgb[i] / 255), [255, 255, 255]);

  const C100 = [0, 160, 233], M100 = [228, 0, 127], Y100 = [255, 241, 0];
  const FILMS = [
    { id: 'C100', fam: 'C', rgb: C100 }, { id: 'M100', fam: 'M', rgb: M100 }, { id: 'Y100', fam: 'Y', rgb: Y100 },
    { id: 'C50', fam: 'C', rgb: tint(C100, .5) }, { id: 'M50', fam: 'M', rgb: tint(M100, .5) }, { id: 'Y50', fam: 'Y', rgb: tint(Y100, .5) },
    { id: 'K30', fam: 'K', rgb: [190, 190, 190] }
  ];

  // ================= PUZZLES =================
  const MODES = {};

  // 01 — Overlap shapes
  const COMPS2 = [
    [['square', 110, 0, 30], ['tri', 140, 0, -78]],
    [['circle', 120, 0, 45], ['circle', 80, 0, -50]],
    [['circle', 100, 0, -30], ['tri', 90, 0, 45]],
    [['square', 100, -38, 0], ['circle', 100, 38, 0]],
    [['tri', 120, -30, 10], ['tri', 120, 30, 10]]
  ];
  const COMPS3 = [
    [['square', 110, 0, 40], ['tri', 140, 0, -68], ['circle', 56, 80, -90]],
    [['circle', 120, 0, 55], ['circle', 80, 0, -40], ['square', 50, 0, -95]],
    [['tri', 150, 0, -20], ['square', 40, 0, 60], ['circle', 40, 0, -85]],
    [['square', 80, -50, 20], ['square', 80, 50, 20], ['circle', 90, 0, -20]]
  ];
  MODES.shape = {
    name: 'Overlap', jp: '図形をかさねる',
    task: 'Overlap the shapes to match the silhouette', taskJp: '図形を重ねて、グレーのシルエットと同じ形にする',
    icon: g => { S('rect', { x: 2, y: 12, width: 18, height: 18 }, g); S('circle', { cx: 22, cy: 14, r: 10 }, g); },
    setup(svg, level, ctx) {
      const comp = level < 2 ? pick(COMPS2) : pick(COMPS3);
      const cx = 190, cy = 200;
      const target = comp.map(([type, size, x, y]) => ({ type, size, x: cx + x, y: cy + y }));
      const tg = S('g', {}, svg);
      target.forEach(s => drawShape(tg, s, { fill: '#2c2c2c' }));
      label(svg, 24, 30, 'TARGET');
      S('line', { x1: 390, y1: 30, x2: 390, y2: 370, stroke: '#1c1c1c' }, svg);
      const pieces = shuffle(target).map((s, i, arr) => ({ ...s, x: 495, y: 200 + (i - (arr.length - 1) / 2) * 125 }));
      const layer = S('g', {}, svg);
      pieces.forEach(p => {
        let node = drawShape(layer, p, { fill: 'rgba(242,242,242,.14)', stroke: FG, 'stroke-width': 1, class: 'drag' });
        let ox, oy;
        draggable(node, svg, ctx, {
          start() { ox = p.x; oy = p.y; layer.appendChild(node); },
          move(dx, dy) {
            p.x = clamp(ox + dx, 0, W); p.y = clamp(oy + dy, 0, H);
            const [, at] = shapeAttrs(p); for (const k in at) node.setAttribute(k, at[k]);
          }
        });
      });
      return () => {
        target.forEach(s => drawShape(svg, s, { fill: 'none', stroke: ACCENT, 'stroke-dasharray': '4 4' }));
        const v = iou(target, pieces);
        return { score: Math.round(clamp((v - 0.4) / 0.6 * 100, 0, 100)), note: `Overlap match <b>${(v * 100).toFixed(1)}%</b>` };
      };
    }
  };

  // 02 — Overlap colors (multiply)
  MODES.color = {
    name: 'Mix', jp: '色をかさねる',
    task: 'Stack color films to match the target', taskJp: 'カラーフィルムを重ねて（乗算）、同じ色をつくる',
    icon: g => { S('circle', { cx: 11, cy: 13, r: 9 }, g); S('circle', { cx: 23, cy: 13, r: 9 }, g); S('circle', { cx: 17, cy: 23, r: 9 }, g); },
    setup(svg, level, ctx) {
      const n = level === 0 ? 2 : level === 1 ? pick([2, 3]) : 3;
      const fams = shuffle(['C', 'M', 'Y', 'K']).slice(0, n);
      const answer = fams.map(f => pick(FILMS.filter(x => x.fam === f)));
      const tColor = multiply(answer);
      label(svg, 40, 22, 'TARGET'); label(svg, 310, 22, 'YOU');
      S('rect', { x: 40, y: 30, width: 250, height: 240, fill: rgbStr(tColor) }, svg);
      const you = S('rect', { x: 310, y: 30, width: 250, height: 240, fill: '#fff' }, svg);
      const on = new Set();
      const cw = 60, gap = 16, x0 = (W - (FILMS.length * cw + (FILMS.length - 1) * gap)) / 2;
      const chips = FILMS.map((f, i) => {
        const g = S('g', { class: 'click' }, svg);
        const x = x0 + i * (cw + gap);
        S('rect', { x, y: 300, width: cw, height: cw, fill: rgbStr(f.rgb) }, g);
        const ring = S('rect', { x: x - 4, y: 296, width: cw + 8, height: cw + 8, fill: 'none', stroke: FG, 'stroke-width': 1.5, opacity: 0 }, g);
        const t = label(g, x + cw / 2, 384, f.id, DIM, 10, 'middle');
        g.addEventListener('pointerdown', () => {
          if (ctx.locked) return;
          on.has(f) ? on.delete(f) : on.add(f);
          ring.setAttribute('opacity', on.has(f) ? 1 : 0);
          t.setAttribute('fill', on.has(f) ? FG : DIM);
          you.setAttribute('fill', rgbStr(multiply([...on])));
        });
        return { f, x };
      });
      return () => {
        chips.forEach(({ f, x }) => { if (answer.includes(f)) S('rect', { x: x - 8, y: 292, width: cw + 16, height: cw + 16, fill: 'none', stroke: ACCENT, 'stroke-dasharray': '3 3' }, svg); });
        const d = deltaE(tColor, multiply([...on]));
        return { score: Math.round(clamp(100 - d * 3, 0, 100)), note: `ΔE <b>${d.toFixed(1)}</b> &nbsp; Answer <b>${answer.map(f => f.id).join(' × ')}</b>` };
      };
    }
  };

  // 03 / 04 — Golden & silver ratio
  function ratioMode(r, name, jp, rLabel, icon) {
    return {
      name, jp, icon,
      task: '', taskJp: '',
      setup(svg, level, ctx) {
        const far = f => { let v; do { v = f(); } while (Math.abs(v - r) / r < 0.15); return v; };
        const handle = (x, y) => {
          const g = S('g', { class: 'drag' }, svg);
          S('circle', { cx: 0, cy: 0, r: 24, fill: 'transparent' }, g);
          S('rect', { x: -5, y: -5, width: 10, height: 10, fill: FG }, g);
          g.setAttribute('transform', `translate(${x},${y})`);
          return g;
        };
        let measure, reveal;
        if (level === 1) {
          ctx.setTask(`Divide the line at 1 : ${rLabel}`, `線を ${jp}（1 : ${rLabel}）で分割する`);
          const x1 = 60, x2 = 540, y = 200, L = x2 - x1;
          S('line', { x1, y1: y, x2, y2: y, stroke: FG }, svg);
          [x1, x2].forEach(x => S('line', { x1: x, y1: y - 12, x2: x, y2: y + 12, stroke: FG }, svg));
          let p;
          do { p = x1 + rand(0.08, 0.92) * L; } while (Math.abs(Math.max(p - x1, x2 - p) / Math.min(p - x1, x2 - p) - r) / r < 0.15);
          const tick = S('line', { y1: y - 20, y2: y + 20, stroke: FG }, svg);
          const h = handle(p, y);
          const draw = () => { tick.setAttribute('x1', p); tick.setAttribute('x2', p); h.setAttribute('transform', `translate(${p},${y})`); };
          draw();
          let o; draggable(h, svg, ctx, { start() { o = p; }, move(dx) { p = clamp(o + dx, x1 + 10, x2 - 10); draw(); } });
          measure = () => Math.max(p - x1, x2 - p) / Math.min(p - x1, x2 - p);
          reveal = () => [x1 + L / (1 + r), x2 - L / (1 + r)].forEach(x => S('line', { x1: x, y1: y - 30, x2: x, y2: y + 30, stroke: ACCENT, 'stroke-dasharray': '3 3' }, svg));
        } else if (level === 0) {
          ctx.setTask(`Make a 1 : ${rLabel} rectangle`, `横長の ${jp}（1 : ${rLabel}）の長方形をつくる`);
          const x0 = 70, hh = 150, y0 = (H - hh) / 2;
          let w = far(() => rand(70, 470) / hh) * hh;
          const rect = S('rect', { x: x0, y: y0, height: hh, fill: 'rgba(242,242,242,.05)', stroke: FG }, svg);
          const h = handle(0, 0);
          const draw = () => { rect.setAttribute('width', w); h.setAttribute('transform', `translate(${x0 + w},${y0 + hh / 2})`); };
          draw();
          let o; draggable(h, svg, ctx, { start() { o = w; }, move(dx) { w = clamp(o + dx, 40, 500); draw(); } });
          measure = () => w / hh;
          reveal = () => S('rect', { x: x0, y: y0, width: hh * r, height: hh, fill: 'none', stroke: ACCENT, 'stroke-dasharray': '4 4' }, svg);
        } else {
          ctx.setTask(`Make a 1 : ${rLabel} portrait rectangle`, `縦長の ${jp}（1 : ${rLabel}）の長方形をつくる`);
          const ww = 140, x0 = (W - ww) / 2, y0 = 25;
          let hh = far(() => rand(60, 345) / ww) * ww;
          const rect = S('rect', { x: x0, y: y0, width: ww, fill: 'rgba(242,242,242,.05)', stroke: FG }, svg);
          const h = handle(0, 0);
          const draw = () => { rect.setAttribute('height', hh); h.setAttribute('transform', `translate(${x0 + ww / 2},${y0 + hh})`); };
          draw();
          let o; draggable(h, svg, ctx, { start() { o = hh; }, move(dx, dy) { hh = clamp(o + dy, 40, 350); draw(); } });
          measure = () => hh / ww;
          reveal = () => S('rect', { x: x0, y: y0, width: ww, height: ww * r, fill: 'none', stroke: ACCENT, 'stroke-dasharray': '4 4' }, svg);
        }
        return () => {
          reveal();
          const u = measure(), err = Math.abs(u - r) / r;
          return { score: Math.round(clamp(100 - err * 400, 0, 100)), note: `You <b>1 : ${u.toFixed(3)}</b> &nbsp; Target <b>1 : ${r.toFixed(3)}</b>` };
        };
      }
    };
  }
  MODES.golden = ratioMode(PHI, 'Golden', '黄金比', '1.618', g => {
    S('rect', { x: 0, y: 6, width: 34, height: 21 }, g); S('line', { x1: 21, y1: 6, x2: 21, y2: 27 }, g);
  });
  MODES.silver = ratioMode(SILVER, 'Silver', '白銀比', '1.414', g => {

  // 05 — Fibonacci tiling
  MODES.fib = {
    name: 'Fibonacci', jp: 'フィボナッチ',
    task: 'Fill the frame with the Fibonacci squares', taskJp: '1・1・2・3・5・8 の正方形で枠をすき間なく埋める',
    icon: g => { S('rect', { x: 0, y: 6, width: 21, height: 21 }, g); S('rect', { x: 21, y: 6, width: 13, height: 13 }, g); S('rect', { x: 21, y: 19, width: 8, height: 8 }, g); },
    setup(svg, level, ctx) {
      const sizes = [[1, 1, 2, 3], [1, 1, 2, 3, 5], [1, 1, 2, 3, 5, 8]][level];
      const u = [40, 34, 24][level];
      // canonical spiral tiling: right, down, left, up …
      let rx = 0, ry = 0, rw = 1, rh = 1; const canon = [{ x: 0, y: 0, s: 1 }];
      for (let i = 1; i < sizes.length; i++) {
        const s = sizes[i], d = (i - 1) % 4;
        if (d === 0) { canon.push({ x: rx + rw, y: ry, s }); rw += s; }
        else if (d === 1) { canon.push({ x: rx, y: ry + rh, s }); rh += s; }
        else if (d === 2) { canon.push({ x: rx - s, y: ry, s }); rx -= s; rw += s; }
        else { canon.push({ x: rx, y: ry - s, s }); ry -= s; rh += s; }
      }
      const bx = 24, by = Math.round((H - rh * u) / 2);
      S('rect', { x: bx, y: by, width: rw * u, height: rh * u, fill: '#0e0e0e', stroke: DIM, 'stroke-dasharray': '2 3' }, svg);
      for (let i = 1; i < rw; i++) S('line', { x1: bx + i * u, y1: by, x2: bx + i * u, y2: by + rh * u, stroke: '#161616' }, svg);
      for (let j = 1; j < rh; j++) S('line', { x1: bx, y1: by + j * u, x2: bx + rw * u, y2: by + j * u, stroke: '#161616' }, svg);
      label(svg, bx, by - 10, `${rw} × ${rh}`);
      // shelf-pack the pieces into the tray
      const tray = { x: 356, y: 12, w: 236 };
      let cx = tray.x, cy = tray.y, row = 0;
      const pieces = sizes.slice().sort((a, b) => b - a).map(s => {
        const px = s * u;
        if (cx + px > tray.x + tray.w) { cx = tray.x; cy += row + 6; row = 0; }
        const p = { s, x: cx, y: cy }; cx += px + 6; row = Math.max(row, px); return p;
      });
      const layer = S('g', {}, svg);
      pieces.forEach(p => {
        const node = S('rect', { x: p.x, y: p.y, width: p.s * u, height: p.s * u, fill: 'rgba(242,242,242,.1)', stroke: FG, class: 'drag' }, layer);
        const t = label(layer, 0, 0, String(p.s), FG, 10, 'middle'); t.style.pointerEvents = 'none';
        const draw = () => { node.setAttribute('x', p.x); node.setAttribute('y', p.y); t.setAttribute('x', p.x + p.s * u / 2); t.setAttribute('y', p.y + p.s * u / 2 + 4); };
        draw();
        let ox, oy;
        draggable(node, svg, ctx, {
          start() { ox = p.x; oy = p.y; layer.appendChild(node); layer.appendChild(t); },
          move(dx, dy) { p.x = clamp(ox + dx, 0, W - p.s * u); p.y = clamp(oy + dy, 0, H - p.s * u); draw(); },
          end() { p.x = bx + Math.round((p.x - bx) / u) * u; p.y = by + Math.round((p.y - by) / u) * u; draw(); }
        });
      });
      return () => {
        const grid = Array.from({ length: rh }, () => new Array(rw).fill(0));
        pieces.forEach(p => {
          const gx = Math.round((p.x - bx) / u), gy = Math.round((p.y - by) / u);
          for (let j = 0; j < p.s; j++) for (let i = 0; i < p.s; i++) { const X = gx + i, Y = gy + j; if (X >= 0 && Y >= 0 && X < rw && Y < rh) grid[Y][X]++; }
        });
        const total = rw * rh, ok = grid.flat().filter(v => v === 1).length;
        canon.forEach(c => S('rect', { x: bx + (c.x - rx) * u, y: by + (c.y - ry) * u, width: c.s * u, height: c.s * u, fill: 'none', stroke: ACCENT, 'stroke-dasharray': '3 3' }, svg));
        return { score: Math.round(ok / total * 100), note: `Filled <b>${ok} / ${total}</b> cells` };
      };
    }
  };

  // 06 — Layout frame
  const LAYOUTS = [
    { n: 3, els: [['photo', 0, 3, 20, 160], ['title', 0, 2, 196, 24], ['text', 0, 2, 236, 100], ['photo', 2, 1, 196, 60]] },
    { n: 2, els: [['title', 0, 2, 20, 34], ['photo', 1, 1, 74, 220], ['text', 0, 1, 74, 140]] },
    { n: 4, els: [['photo', 1, 3, 20, 200], ['title', 0, 3, 236, 26], ['text', 0, 2, 278, 62], ['text', 3, 1, 236, 104]] }
  ];
  function drawEl(parent, type, w, h) {
    if (type === 'photo') { S('rect', { width: w, height: h, fill: '#2b2b2b' }, parent); S('line', { x1: 0, y1: 0, x2: w, y2: h, stroke: '#444' }, parent); S('line', { x1: w, y1: 0, x2: 0, y2: h, stroke: '#444' }, parent); }
    else if (type === 'title') S('rect', { width: w, height: h, fill: FG }, parent);
    else { S('rect', { width: w, height: h, fill: 'transparent' }, parent); for (let y = 3; y < h; y += 10) S('line', { x1: 0, y1: y, x2: y + 10 >= h ? w * .6 : w, y2: y, stroke: '#8a8a8a', 'stroke-width': 3 }, parent); }
  }
  MODES.layout = {
    name: 'Layout', jp: 'レイアウト',
    task: 'Place the elements on the grid like the target', taskJp: 'お手本どおりに、要素をグリッドへ配置する',
    icon: g => { S('rect', { x: 4, y: 0, width: 26, height: 34 }, g); S('line', { x1: 13, y1: 0, x2: 13, y2: 34 }, g); S('line', { x1: 21, y1: 0, x2: 21, y2: 34 }, g); },
    setup(svg, level, ctx) {
      const L = LAYOUTS[level];
      const P = { x: 30, y: 20, w: 280, h: 360 }, m = 20, g = 12;
      const colW = (P.w - 2 * m - (L.n - 1) * g) / L.n;
      const els = L.els.map(([type, c0, span, y, h]) => ({ type, w: span * colW + (span - 1) * g, h, tx: P.x + m + c0 * (colW + g), ty: P.y + y }));
      S('rect', { x: P.x, y: P.y, width: P.w, height: P.h, fill: '#0b0b0b', stroke: '#333' }, svg);
      for (let i = 0; i < L.n; i++) S('rect', { x: P.x + m + i * (colW + g), y: P.y + m, width: colW, height: P.h - 2 * m, fill: 'rgba(255,59,31,.07)' }, svg);
      // thumbnail
      const k = 0.4, T = S('g', { transform: `translate(350,20) scale(${k})` }, svg);
      S('rect', { width: P.w, height: P.h, fill: '#0b0b0b', stroke: '#555', 'stroke-width': 2 }, T);
      els.forEach(e => drawEl(S('g', { transform: `translate(${e.tx - P.x},${e.ty - P.y})` }, T), e.type, e.w, e.h));
      label(svg, 350, 182, 'TARGET');
      const layer = S('g', {}, svg);
      els.forEach(e => {
        const a = rand(0, Math.PI * 2), d = rand(60, 130);
        e.x = clamp(e.tx + Math.cos(a) * d, 0, W - e.w); e.y = clamp(e.ty + Math.sin(a) * d, 0, H - e.h);
        const node = S('g', { class: 'drag' }, layer);
        drawEl(node, e.type, e.w, e.h);
        const draw = () => node.setAttribute('transform', `translate(${e.x},${e.y})`);
        draw();
        let ox, oy;
        draggable(node, svg, ctx, { start() { ox = e.x; oy = e.y; layer.appendChild(node); }, move(dx, dy) { e.x = clamp(ox + dx, 0, W - e.w); e.y = clamp(oy + dy, 0, H - e.h); draw(); } });
      });
      return () => {
        els.forEach(e => S('rect', { x: e.tx, y: e.ty, width: e.w, height: e.h, fill: 'none', stroke: ACCENT, 'stroke-dasharray': '4 4' }, svg));
        const err = els.reduce((s, e) => s + Math.hypot(e.x - e.tx, e.y - e.ty), 0) / els.length;
        return { score: Math.round(clamp(100 - err * 1.8, 0, 100)), note: `Avg offset <b>${err.toFixed(1)}px</b>` };
      };
    }
  };

  // 07 — Type jump ratio
  MODES.jump = {
    name: 'Jump', jp: 'ジャンプ率',
    task: '', taskJp: '',
    icon: g => { const t = S('text', { x: 0, y: 30, 'font-size': 30, fill: FG, stroke: 'none' }, g); t.textContent = 'A'; const s = S('text', { x: 22, y: 30, 'font-size': 11, fill: FG, stroke: 'none' }, g); s.textContent = 'a'; },
    setup(svg, level, ctx, extra) {
      const target = pick([[1.5, 2, 2.5], [3, 4], [5, 6, 8]][level]);
      ctx.setTask(`Set the jump ratio to ${target}×`, `見出しと本文のサイズ比（ジャンプ率）を ${target} 倍にする`);
      const body = 11, maxR = 10, X = 50, TOP = 46;
      const word = pick(['Design', 'Grid', 'Type', 'Form', 'Space', 'Layout']);
      const head = S('text', { x: X, fill: FG, 'font-weight': 500 }, svg); head.textContent = word;

      const bodyEls = lines.map(t => { const e = S('text', { x: X, fill: '#9a9a9a', 'font-size': body }, svg); e.textContent = t; return e; });
      let r; do { r = Math.exp(rand(0, Math.log(maxR))); } while (Math.abs(Math.log(r / target)) < Math.log(1.4));
      const draw = () => {

      inp.addEventListener('input', () => { if (ctx.locked) return; r = Math.exp(inp.value / 1000 * Math.log(maxR)); draw(); });

        const err = Math.abs(Math.log(r / target));

  // 08 — Theme palette: pick 3 colors (top → bottom) and set their balance
  const THEMES = [
    { en: 'Beer', jp: 'ビール', colors: ['#f2e6c4', '#e9a82a', '#b9690f'], ratio: [0.2, 0.5, 0.3], decoys: ['#ffffff', '#ffe14d', '#7a3e0a'] },
    { en: 'Winter sea', jp: '冬の海', colors: ['#9aa5ad', '#2d4654', '#d5dde0'], ratio: [0.4, 0.45, 0.15], decoys: ['#7ec8f0', '#0077b6', '#ffffff'] },
    { en: 'Desert', jp: '砂漠', colors: ['#a9c9dc', '#ddb277', '#9c6236'], ratio: [0.35, 0.45, 0.2], decoys: ['#4fa8ff', '#f3d34a', '#5a3a22'] }
  ];
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const isLight = h => { const [r, g, b] = hexRgb(h); return (r * 0.299 + g * 0.587 + b * 0.114) / 255 > 0.6; };
  MODES.palette = {

    icon: g => { S('rect', { x: 9, y: 1, width: 16, height: 7 }, g); S('rect', { x: 9, y: 8, width: 16, height: 15 }, g); S('rect', { x: 9, y: 23, width: 16, height: 10 }, g); },
    setup(svg, level, ctx) {
      const th = THEMES[level];
      ctx.setTask(`Pick 3 colors for “${th.en}” and set the balance`, `「${th.jp}」の3色を上から順に選び、配分を指で調整する`);
      const BX = 230, BY = 24, BW = 140, BH = 352;
      label(svg, BX, 16, 'YOU');
      const chosen = [];
      let d = [1 / 3, 2 / 3];
      const segs = [0, 1, 2].map(() => S('rect', { x: BX, width: BW }, svg));
      S('rect', { x: BX, y: BY, width: BW, height: BH, fill: 'none', stroke: '#333' }, svg);
      const handles = [0, 1].map(i => {
        const g = S('g', { class: 'drag' }, svg);
        S('rect', { x: BX - 24, y: -16, width: BW + 48, height: 32, fill: 'transparent' }, g);
        S('line', { x1: BX - 10, y1: 0, x2: BX + BW + 10, y2: 0, stroke: FG }, g);
        S('rect', { x: BX + BW + 10, y: -6, width: 12, height: 12, fill: FG }, g);
        let o;
        draggable(g, svg, ctx, {
          start() { o = d[i]; },
          move(dx, dy) { d[i] = i === 0 ? clamp(o + dy / BH, 0.04, d[1] - 0.04) : clamp(o + dy / BH, d[0] + 0.04, 0.96); draw(); }
        });
        return g;
      });
      const draw = () => {
        const edges = [0, d[0], d[1], 1];
        segs.forEach((s, i) => {
          s.setAttribute('y', BY + edges[i] * BH); s.setAttribute('height', (edges[i + 1] - edges[i]) * BH);
          if (chosen[i]) { s.setAttribute('fill', chosen[i]); s.setAttribute('stroke', 'none'); }

        });
        handles.forEach((h, i) => h.setAttribute('transform', `translate(0,${BY + d[i] * BH})`));
      };
      // swatches: 3 correct + 3 decoys, shuffled
      const chips = shuffle([...th.colors, ...th.decoys]).map((hex, k) => {
        const x = 430 + (k % 2) * 86, y = 30 + Math.floor(k / 2) * 116, s = 70;
        const g = S('g', { class: 'click' }, svg);

        const ring = S('rect', { x: x - 4, y: y - 4, width: s + 8, height: s + 8, fill: 'none', stroke: FG, 'stroke-width': 1.5, opacity: 0 }, g);
        const num = label(g, x + s / 2, y + s / 2 + 5, '', isLight(hex) ? '#111' : '#fff', 14, 'middle');
        g.addEventListener('pointerdown', () => {
          if (ctx.locked) return;
          const at = chosen.indexOf(hex);
          if (at >= 0) chosen.splice(at, 1); else if (chosen.length < 3) chosen.push(hex);
          chips.forEach(c => { const i = chosen.indexOf(c.hex); c.ring.setAttribute('opacity', i >= 0 ? 1 : 0); c.num.textContent = i >= 0 ? String(i + 1) : ''; });

      });

      return () => {

        th.colors.forEach((c, i) => {

          S('rect', { x: 60, y, width: 110, height: h, fill: c }, svg);

          y += h;

        chips.forEach(c => { if (th.colors.includes(c.hex)) S('rect', { x: c.x - 8, y: c.y - 8, width: c.s + 16, height: c.s + 16, fill: 'none', stroke: ACCENT, 'stroke-dasharray': '3 3' }, svg); });
        const mine = [d[0], d[1] - d[0], 1 - d[1]];

  const ORDER = ['shape', 'color', 'golden', 'silver', 'fib', 'layout', 'jump', 'palette'];

  function play(seq, title, storeKey) {
    const scores = [];
    $mode.textContent = title;
    const round = () => {
      if (cleanup) { cleanup(); cleanup = null; }
      const n = scores.length, step = seq[n], m = MODES[step.key];
      $round.textContent = `${n + 1} / ${seq.length}`;
      $main.innerHTML = '';
      const bar = el('div', 'bar');
      const task = el('div', 'task');
      const tEn = el('div', '', m.task), tJp = el('div', 'jp', m.taskJp);
      task.append(tEn, tJp);
      const dots = el('div', 'dots');
      seq.forEach((_, i) => dots.appendChild(el('i', i < n ? 'on' : '')));
      bar.append(task, dots);
      const svg = S('svg', { viewBox: `0 0 ${W} ${H}`, class: 'stage' });
      const extra = el('div', 'extra');
      const controls = el('div', 'controls');
      const result = el('div', 'result', `<span class="jp">${m.jp}</span>`);
      const btn = el('button', 'primary', 'Check');
      controls.append(result, btn);
      $main.append(bar, svg, extra, controls);

      const ctx = { locked: false, setTask(en, jp) { tEn.textContent = en; tJp.textContent = jp; } };
      const judge = m.setup(svg, step.level, ctx, extra);
      let done = false;
      const next = () => {
        if (!done) {
          done = true; ctx.locked = true;
          const r = judge();
          scores.push(r.score);
          dots.children[n].classList.add('on');
          result.innerHTML = `Score <b>${r.score}</b> &nbsp; ${r.note}`;
          btn.textContent = scores.length < seq.length ? 'Next' : 'Result';
        } else {
          scores.length < seq.length ? round() : finish(title, storeKey, scores);
        }
      };
      btn.onclick = next;
      const onKey = e => {
        if (e.key === 'Enter') { e.preventDefault(); next(); }
        if (e.key === 'Escape') menu();
      };
      document.addEventListener('keydown', onKey);
      cleanup = () => document.removeEventListener('keydown', onKey);
    };
    round();
  }

  function finish(title, storeKey, scores) {
    if (cleanup) { cleanup(); cleanup = null; }
    const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
    const prev = store.get(storeKey);
    if (avg > prev) store.set(storeKey, avg);
    const ranks = [[95, 'Pixel perfect', '完璧な目'], [85, 'Art director', 'アートディレクター級'], [70, 'Senior designer', 'シニアデザイナー級'], [50, 'Junior designer', 'ジュニアデザイナー級'], [0, 'Intern', 'インターン']];
    const [, rank, rankJp] = ranks.find(r => avg >= r[0]);
    $round.textContent = '';
    $main.innerHTML = '';
    const f = el('div', 'final');
    f.innerHTML = `
      <div class="jp">${title} — Result</div>
      <div class="score">${avg}</div>
      <div>${rank} &nbsp;<span class="jp">${rankJp}</span>${avg > prev ? ' &nbsp;<span style="color:var(--accent)">New best</span>' : ''}</div>
      <div class="rows">${scores.map((s, i) => `<div class="row"><span>Round ${i + 1}</span><b>${s}</b></div>`).join('')}</div>`;
    const ctr = el('div', 'controls');
    const g = el('div'); g.style.display = 'flex'; g.style.gap = '10px';
    const back = el('button', '', 'Menu'); back.onclick = menu;
    g.append(back);
    ctr.append(el('div', 'result', 'Best ' + Math.max(avg, prev)), g);
    f.appendChild(ctr);
    $main.appendChild(f);
  }

  document.getElementById('home').onclick = menu;
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(menu);
})();
</script>
